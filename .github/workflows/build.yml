name: Auto Build Mod Menu

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코어 소스 가져오기
        uses: actions/checkout@v4

      - name: Dobby 라이브러리 가져오기
        run: |
          rm -rf dobby_lib
          git clone --depth 1 https://github.com/jmpews/Dobby.git dobby_lib
          rm -rf dobby_lib/.git

      - name: Android NDK 다운로드 및 설정 (r23c)
        run: |
          echo "Downloading NDK r23c..."
          wget -q https://dl.google.com/android/repository/android-ndk-r23c-linux.zip
          unzip -q android-ndk-r23c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r23c" >> $GITHUB_ENV

      - name: CMake 빌드 실행
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-21 \
                ..
          make -j4

      - name: 완성된 .so 파일 저장
        uses: actions/upload-artifact@v4
        with:
          name: modmenu-so
          path: build/libsolar.so
