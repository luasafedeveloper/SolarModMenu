name: Build Android Mod Menu

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v2
        with:
          ndk-version: r25c
          local-cache: true

      - name: Build with NDK
        run: |
          $ANDROID_NDK_HOME/ndk-build
