name: Auto Build Mod Menu

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 코어 소스 가져오기
      uses: actions/checkout@v4

    - name: Dobby 라이브러리 가져오기
      run: |
        git clone https://github.com/jmpews/Dobby.git dobby_lib
        rm -rf dobby_lib/.git

    - name: Android NDK 및 CMake 설정
      uses: nttld/setup-ndk@v3
      id: setup-ndk
      with:
        ndk-version: r27c
        add-to-path: true

    - name: CMake 빌드 실행
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk }}/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-21 \
              ..
        make -j4

    - name: 완성된 .so 파일 저장 (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: modmenu-so
        path: build/libsolar.so
