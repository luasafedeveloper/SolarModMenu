name: Auto Build Mod Menu

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 코어 소스 가져오기
      uses: actions/checkout@v3

    - name: 필수 라이브러리(Dobby & ImGui) 클론
      run: |
        mkdir -p jni
        git clone --depth 1 https://github.com/jmpews/Dobby.git jni/dobby
        git clone --depth 1 https://github.com/ocornut/imgui.git jni/imgui

    - name: Android NDK 다운로드 및 설정
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip -q android-ndk-r25c-linux.zip

    - name: ndk-build 컴파일 실행
      run: |
        ./android-ndk-r25c/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk || ./android-ndk-r25c/ndk-build

    - name: 완성된 .so 파일 저장 (Artifact)
      uses: actions/upload-artifact@v3
      with:
        name: modmenu-so
        path: libs/arm64-v8a/libmodmenu.so
